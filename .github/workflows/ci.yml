name: CI

# Required check on every pull request. Read-only: never deploys.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    # Unit, architecture (Spring Modulith + ArchUnit) and PostgreSQL integration tests (Testcontainers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  api-dependencies:
    # Known advisories in the API's Maven dependencies (OSV database). Fails on any match.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.2.1
          scan source --lockfile /src/apps/api/pom.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Any high advisory blocks. Ignored, with a reason, in apps/web/package.json (pnpm.auditConfig):
      # GHSA-fc5q-39xc-vjpf (picomatch, used by Vite at build time; no fixed release yet, 2026-11-17).
      - run: pnpm audit --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run test:architecture
      - run: pnpm run test:brand
      - run: pnpm run test
      - run: pnpm run build
