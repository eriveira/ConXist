spring:
  application:
    name: conxist-api
  datasource:
    url: ${CONXIST_DB_URL:jdbc:postgresql://localhost:5432/conxist}
    username: ${CONXIST_DB_USER:conxist}
    password: ${CONXIST_DB_PASSWORD:}
  servlet:
    multipart:
      # One limit, set under conxist.capture.max-file-bytes.
      max-file-size: ${conxist.capture.max-file-bytes}B
      max-request-size: ${conxist.capture.max-file-bytes}B
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete

logging:
  structured:
    format:
      console: ecs

server:
  # No sign-in yet (ADR 0002): the API only listens on this machine, and refuses to start otherwise.
  address: 127.0.0.1
  port: ${CONXIST_API_PORT:8080}

conxist:
  capture:
    max-file-bytes: 26214400 # 25 MB
    max-text-characters: 2000000
    storage-root: ${CONXIST_STORAGE_ROOT:./data/uploads}
    accepted-media-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - text/markdown
      - text/x-web-markdown
  plaud:
    # Plaud Enterprise API (Team workspaces), read-only. See docs/adr/0003-plaud-team-source.md.
    api-base-url: ${CONXIST_PLAUD_API_URL:https://api.plaud.ai/enterprise/v1}
    token-url: ${CONXIST_PLAUD_TOKEN_URL:https://api.plaud.ai/team-oauth/oauth/token}
    # The issuer string Plaud sends with a credential (exact match). The default is a guess until Plaud confirms it.
    token-audience: ${CONXIST_PLAUD_TOKEN_AUDIENCE:https://api.plaud.ai/team-oauth}
    page-size: 100
    sync-interval: ${CONXIST_PLAUD_SYNC_INTERVAL:5m}
    connect-timeout: 10s
    read-timeout: 30s
    account:
      # A person's own Plaud account: Plaud's MCP server and its sign-in (OAuth). See docs/adr/0005-plaud-sign-in.md.
      mcp-url: ${CONXIST_PLAUD_MCP_URL:https://mcp.plaud.ai/mcp}
      # Where Plaud's sign-in page sends the person back: this API's callback, on this machine.
      redirect-uri: ${CONXIST_PLAUD_REDIRECT_URI:http://127.0.0.1:${server.port}/api/recorders/plaud/callback}
  runs:
    # Test runs (ADR 0012). The owner's own Anthropic key; blank means test runs say a key is missing.
    anthropic-api-key: ${CONXIST_ANTHROPIC_API_KEY:}
    # Blank for Anthropic's own API.
    anthropic-base-url: ${CONXIST_ANTHROPIC_BASE_URL:}
    # The models a workspace may pick for a preset in Settings (ADR 0014).
    models:
      - id: claude-haiku-5-5
        label: Claude Haiku 5.5
        fallbacks: false # Haiku has no server-side fallback
      - id: claude-sonnet-5-5
        label: Claude Sonnet 5.5
        fallbacks: true
      - id: claude-opus-5-5
        label: Claude Opus 5.5
        fallbacks: true
    # Each preset's default model, and its effort and token limit, which stay with the preset.
    fast:
      model: claude-haiku-5-5
      effort: LOW
      max-tokens: 8000
    balanced:
      model: claude-sonnet-5-5
      effort: MEDIUM
      max-tokens: 16000
    thorough:
      model: claude-opus-5-5
      effort: HIGH
      # A call that does not stream; more room than this needs streaming (ADR 0012, later).
      max-tokens: 16000
  secrets:
    # 32 random bytes, base64: openssl rand -base64 32. Required; there is no default on purpose.
    encryption-key: ${CONXIST_SECRETS_KEY:}
