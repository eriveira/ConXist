spring:
  application:
    name: conxist-api
  datasource:
    url: ${CONXIST_DB_URL:jdbc:postgresql://localhost:5432/conxist}
    username: ${CONXIST_DB_USER:conxist}
    password: ${CONXIST_DB_PASSWORD:}
  servlet:
    multipart:
      # One limit, set under conxist.capture.max-file-bytes.
      max-file-size: ${conxist.capture.max-file-bytes}B
      max-request-size: ${conxist.capture.max-file-bytes}B
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete

logging:
  structured:
    format:
      console: ecs

server:
  # No sign-in yet (ADR 0002): the API only listens on this machine, and refuses to start otherwise.
  address: 127.0.0.1
  port: ${CONXIST_API_PORT:8080}

conxist:
  workspace:
    default-id: ${CONXIST_WORKSPACE_ID:00000000-0000-0000-0000-000000000001}
  capture:
    max-file-bytes: 26214400 # 25 MB
    max-text-characters: 2000000
    storage-root: ${CONXIST_STORAGE_ROOT:./data/uploads}
    accepted-media-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - text/markdown
      - text/x-web-markdown
  plaud:
    # Plaud Enterprise API (Team workspaces), read-only. See docs/adr/0003-plaud-team-source.md.
    api-base-url: ${CONXIST_PLAUD_API_URL:https://api.plaud.ai/enterprise/v1}
    token-url: ${CONXIST_PLAUD_TOKEN_URL:https://api.plaud.ai/team-oauth/oauth/token}
    # The issuer string Plaud sends with a credential (exact match). The default is a guess until Plaud confirms it.
    token-audience: ${CONXIST_PLAUD_TOKEN_AUDIENCE:https://api.plaud.ai/team-oauth}
    page-size: 100
    sync-interval: ${CONXIST_PLAUD_SYNC_INTERVAL:5m}
    connect-timeout: 10s
    read-timeout: 30s
  secrets:
    # 32 random bytes, base64: openssl rand -base64 32. Required; there is no default on purpose.
    encryption-key: ${CONXIST_SECRETS_KEY:}
