spring:
  application:
    name: conxist-api
  datasource:
    url: ${CONXIST_DB_URL:jdbc:postgresql://localhost:5432/conxist}
    username: ${CONXIST_DB_USER:conxist}
    password: ${CONXIST_DB_PASSWORD:}
  servlet:
    multipart:
      # One limit, set under conxist.capture.max-file-bytes.
      max-file-size: ${conxist.capture.max-file-bytes}B
      max-request-size: ${conxist.capture.max-file-bytes}B
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete

logging:
  structured:
    format:
      console: ecs

server:
  # No sign-in yet (ADR 0002): the API only listens on this machine, and refuses to start otherwise.
  address: 127.0.0.1
  port: ${CONXIST_API_PORT:8080}

conxist:
  workspace:
    default-id: ${CONXIST_WORKSPACE_ID:00000000-0000-0000-0000-000000000001}
  capture:
    max-file-bytes: 26214400 # 25 MB
    max-text-characters: 2000000
    storage-root: ${CONXIST_STORAGE_ROOT:./data/uploads}
    accepted-media-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - text/markdown
      - text/x-web-markdown
